<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ruta del Dinero — Newsletter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #2b1a10;
    --ink: #f5ecdb;
    --muted: #b8a688;
    --coral: #e8b429;
    --coral-dim: #8a5a1e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }
  .wrap{
    max-width:460px;
    width:100%;
    text-align:center;
  }
  .photo{
    width:132px;
    height:132px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--coral-dim);
    margin:0 auto 32px;
    display:block;
    filter:grayscale(15%);
  }
  h1{
    font-family:'Poppins',Helvetica,Arial,sans-serif;
    font-weight:800;
    line-height:1.18;
    letter-spacing:-0.2px;
    margin:0 0 34px;
    font-size:clamp(27px,6.4vw,38px);
  }
  h1 .line1{ color:var(--ink); display:block; }
  h1 .line2{
    display:block;
    background: linear-gradient(135deg, #f3dc9b 0%, #c9972e 55%, #9c6f1c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: #c9972e;
    -webkit-text-fill-color: transparent;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    max-width:340px;
    margin:0 auto 36px;
  }
  .formbox{
    margin:0 auto 40px;
  }
  iframe{
    width:100%;
    max-width:400px;
    border:0;
    display:block;
    margin:0 auto;
  }
  footer{
    border-top:1px solid #2a261f;
    padding-top:20px;
    margin-top:8px;
  }
  footer .name{
    font-weight:600;
    color:var(--ink);
    font-size:14px;
    margin:0 0 4px;
  }
  footer .quote{
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
    margin:0;
  }
</style>
</head>
